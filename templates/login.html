<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ingreso</title>
</head>
<body class="px-12 py-4">
    <form method="post" action="/" class="w-96 border shadow-xl mx-auto mt-7 p-4">
        <h2 class="mb-4 text-xl font-bold">Entrar al Sistema</h2>
        <div class="flex mb-4">
            <label>
                Usuario:
                <input type="text" name="id_lector" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label> 
        </div>
        <div class="mb-4">
            <label>
                Algoritmo de recomendación:
                <select name="algoritmo" id="algoritmo" class="p-1 border rounded" onchange="actualizarDescripcion()">
                    <option value="perfil_balanceado" selected>Perfil balanceado (personalizado)</option>
                    <option value="vision_tunel">Visión de túnel (personalizado)</option>
                    <option value="top_n">Mejor valorados</option>
                    <option value="mas_valorados">Más valorados</option>
                    <option value="random">Aleatorio</option>
                    <option value="naive">Naive (Baseline de Surprise)</option>
                    <option value="svd">SVD (Surprise)</option>
                    <option value="ease">EASE (autoencoder lineal)</option>
                    <option value="dos_torres">Dos torres (red neuronal)</option>
                    <option value="gran_torre">Una gran torre (red neuronal)</option>
                    <option value="cascada_naive">Cascada naive</option>
                    <option value="cascada_svd">Cascada SVD</option>
                    <option value="cascada_ease">Cascada EASE</option>
                    <option value="cascada_dos_torres">Cascada dos torres</option>
                    <option value="cascada_gran_torre">Cascada gran torre</option>
                    <option value="ensamble">Ensamble (LightGBM)</option>
                    <option value="cascada_ensamble">Cascada ensamble</option>
                </select>
            </label>
            <p id="descripcion-algoritmo" class="text-xs text-neutral-500 mt-1"></p>
        </div>
        <!--
        <div class="flex mb-4">
            <label>
                Nombre:
                <input type="text" name="nombre" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Genero:
                <select name="genero" required class="p-1 border rounded">
                    <option value="">Seleccione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Vive en:
                <input type="text" name="vive_en" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Año de nacimiento:
                <input type="number" name="nacimiento" min="1900" max="2023" pattern="[0-9]{4}" maxlength="4" required class="p-1 border rounded">
            </label>
        </div>
        -->
        <div class="flex justify-end">
            <button type="submit" class="border bg-teal-500 hover:bg-teal-700 text-white text-lg py-2 px-4 ml-auto">
                Ingresar
            </button>
        </div>
    </form>
    <script>
        const descripciones = {
            perfil_balanceado: "Recomendaciones personalizadas según los géneros y autores que valoraste, ponderadas con la valoración general de cada libro.",
            vision_tunel: "Una versión más estricta de la recomendación personalizada: el libro tiene que coincidir en género Y en autor con tus favoritos. Si no hay suficientes, se completa con libros populares.",
            top_n: "Los libros con mejor valoración promedio (con al menos 5 valoraciones) que todavía no valoraste ni viste.",
            mas_valorados: "Los libros con más valoraciones que todavía no valoraste ni viste.",
            random: "Una selección al azar de libros que todavía no valoraste ni viste.",
            naive: "Ordena los libros por su sesgo: cuánto mejor o peor los valoran todos respecto de la media (BaselineOnly). Es igual para todos los lectores.",
            svd: "Estima tu valoración con factores latentes de lectores y libros, aprendidos por factorización de matrices (SVD).",
            ease: "Un modelo lineal aprende cuánto suma cada libro que leíste a favor de cada otro libro, y te recomienda los que más puntaje acumulan con tus lecturas (EASE).",
            dos_torres: "Una red neuronal aprende qué libros elegís frente a los que no elegís, y te recomienda los más afines comparando tu embedding con el de cada libro.",
            gran_torre: "Una red neuronal estima la probabilidad de que elijas cada libro, a partir de vos, el libro, su autor, género, editorial y año de edición, y tu género y año de nacimiento.",
            cascada_naive: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si el modelo no te conoce todavía, visión de túnel; si no, naive.",
            cascada_svd: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si el modelo no te conoce todavía, visión de túnel; si no, SVD.",
            cascada_ease: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si el modelo no te conoce todavía, visión de túnel; si no, EASE.",
            cascada_dos_torres: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si el modelo no te conoce todavía, visión de túnel; si no, dos torres.",
            cascada_gran_torre: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si el modelo no te conoce todavía, visión de túnel; si no, una gran torre.",
            ensamble: "Combina SVD, EASE, dos torres y gran torre: un modelo LightGBM reordena los libros que propone cada uno según el puntaje y la posición que le dan.",
            cascada_ensamble: "Elige el algoritmo según cuánto te conoce: con hasta 2 valoraciones, los libros mejor valorados; si ningún modelo te conoce todavía, visión de túnel; si no, el ensamble de modelos."
        };

        function actualizarDescripcion() {
            const select = document.getElementById('algoritmo');
            document.getElementById('descripcion-algoritmo').textContent = descripciones[select.value] || '';
        }

        actualizarDescripcion();
    </script>
</body>
</html>
