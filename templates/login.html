<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ingreso</title>
</head>
<body class="px-12 py-4">
    <form method="post" action="/" class="w-96 border shadow-xl mx-auto mt-7 p-4">
        <h2 class="mb-4 text-xl font-bold">Entrar al Sistema</h2>
        <div class="flex mb-4">
            <label>
                Usuario:
                <input type="text" name="id_lector" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label> 
        </div>
        <div class="mb-4">
            <label>
                Algoritmo de recomendación:
                <select name="algoritmo" id="algoritmo" class="p-1 border rounded" onchange="actualizarDescripcion()">
                    <option value="perfil_balanceado" selected>Perfil balanceado (personalizado)</option>
                    <option value="vision_tunel">Visión de túnel (personalizado)</option>
                    <option value="top_n">Mejor valorados</option>
                    <option value="mas_valorados">Más valorados</option>
                    <option value="random">Aleatorio</option>
                    <option value="baseline">Baseline (Surprise)</option>
                    <option value="knn">KNN (Surprise)</option>
                    <option value="svd">SVD (Surprise)</option>
                    <option value="dos_torres">Dos torres (red neuronal)</option>
                    <option value="gran_torre">Una gran torre (red neuronal)</option>
                </select>
            </label>
            <p id="descripcion-algoritmo" class="text-xs text-neutral-500 mt-1"></p>
        </div>
        <!--
        <div class="flex mb-4">
            <label>
                Nombre:
                <input type="text" name="nombre" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Genero:
                <select name="genero" required class="p-1 border rounded">
                    <option value="">Seleccione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Vive en:
                <input type="text" name="vive_en" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label>
        </div>
        <div class="flex mb-4">
            <label>
                Año de nacimiento:
                <input type="number" name="nacimiento" min="1900" max="2023" pattern="[0-9]{4}" maxlength="4" required class="p-1 border rounded">
            </label>
        </div>
        -->
        <div class="flex justify-end">
            <button type="submit" class="border bg-teal-500 hover:bg-teal-700 text-white text-lg py-2 px-4 ml-auto">
                Ingresar
            </button>
        </div>
    </form>
    <script>
        const descripciones = {
            perfil_balanceado: "Recomendaciones personalizadas según los géneros y autores que valoraste, ponderadas con la valoración general de cada libro.",
            vision_tunel: "Una versión más estricta de la recomendación personalizada: el libro tiene que coincidir en género Y en autor con tus favoritos. Si no hay suficientes, se completa con libros populares.",
            top_n: "Los libros con mejor valoración promedio (con al menos 5 valoraciones) que todavía no valoraste ni viste.",
            mas_valorados: "Los libros con más valoraciones que todavía no valoraste ni viste.",
            random: "Una selección al azar de libros que todavía no valoraste ni viste.",
            baseline: "Estima tu valoración de cada libro con la media general más tu sesgo como lector y el sesgo del libro (BaselineOnly).",
            knn: "Estima tu valoración a partir de los 40 lectores con gustos más parecidos a los tuyos (KNNWithMeans). Si todavía no tenés suficientes valoraciones, usa Baseline.",
            svd: "Estima tu valoración con factores latentes de lectores y libros, aprendidos por factorización de matrices (SVD).",
            dos_torres: "Una red neuronal elige los 100 libros más afines a vos comparando tu embedding con el de cada libro, y otra red los ordena según la valoración que estima que les darías. Si todavía no tenés valoraciones, usa Baseline.",
            gran_torre: "Una red neuronal estima tu valoración de cada libro a partir de vos, el libro, su autor, género, editorial y año de edición, y tu género y año de nacimiento. Si todavía no tenés valoraciones, usa Baseline."
        };

        function actualizarDescripcion() {
            const select = document.getElementById('algoritmo');
            document.getElementById('descripcion-algoritmo').textContent = descripciones[select.value] || '';
        }

        actualizarDescripcion();
    </script>
</body>
</html>
